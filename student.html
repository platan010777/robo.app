<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>📖 Занятия — КЛАСС РОБОТОТЕХНИКИ</title>
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
      background: #e4e3f3;
      color: #1f2937;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(90deg, #4f46e5, #9333ea);
      color: #fff;
      padding: 16px 20px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .topbar h1 {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .group-badge {
      display: inline-block;
      background: linear-gradient(90deg, #4f46e5, #9333ea);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(79,70,229,.3);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #4f46e5;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lesson-card {
      background: #fafafa;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      margin-bottom: 12px;
      border-left: 5px solid #4f46e5;
      transition: transform .15s;
    }

    .lesson-card:hover {
      transform: translateY(-2px);
    }

    .lesson-card.past {
      opacity: 0.7;
      border-left-color: #9ca3af;
    }

    .lesson-card.today {
      border-left-color: #22c55e;
      background: #f0fdf4;
    }

    .lesson-date {
      color: #4f46e5;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lesson-card.past .lesson-date {
      color: #6b7280;
    }

    .lesson-card.today .lesson-date {
      color: #16a34a;
    }

    .lesson-topic {
      font-size: 1.1rem;
      color: #1f2937;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .lesson-teacher {
      font-size: 0.9rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .today-badge {
      display: inline-block;
      background: #22c55e;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .loading, .empty-state, .error-state {
      text-align: center;
      padding: 50px 20px;
      font-size: 1.1rem;
      color: #6b7280;
    }

    .loading {
      color: #4f46e5;
    }

    .error-state {
      color: #ef4444;
    }

    .robot-emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
    <header class="topbar" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <h1 style="font-size:1.1rem;display:flex;align-items:center;gap:8px;">🤖 КЛАСС РОБОТОТЕХНИКИ</h1>
    <button id="chat-btn" style="
      background:rgba(255,255,255,.2);
      color:#fff;
      border:none;
      padding:8px 14px;
      border-radius:12px;
      cursor:pointer;
      font-size:0.95rem;
      display:flex;
      align-items:center;
      gap:6px;
      position:relative;
      transition:background .15s;
    " onmouseover="this.style.background='rgba(255,255,255,.3)'" onmouseout="this.style.background='rgba(255,255,255,.2)'">
      💬 Чат
      <span id="chat-badge" style="
        display:none;
        background:#ef4444;
        color:#fff;
        border-radius:999px;
        padding:1px 7px;
        font-size:0.75rem;
        font-weight:bold;
        min-width:18px;
        text-align:center;
      ">0</span>
    </button>
  </header>

  <main>
    <div id="group-info"></div>
    <div id="lessons-list">
      <div class="loading">
        <span class="robot-emoji">🤖</span>
        Загружаю занятия...
      </div>
    </div>
  </main>

  <div class="footer">
    Сделано с ❤️ для юных робототехников
  </div>

  <!-- Модальное окно чата -->
  <div id="chat-modal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:16px;
  ">
    <div style="
      background:#fff;
      border-radius:20px;
      width:100%;
      max-width:600px;
      height:90vh;
      max-height:700px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    ">
      <!-- Шапка чата -->
      <div style="
        background:linear-gradient(90deg,#4f46e5,#9333ea);
        color:#fff;
        padding:16px 20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">
        <div style="font-weight:bold;font-size:1.1rem;">💬 Чат</div>
        <button id="chat-close" style="
          background:rgba(255,255,255,.2);
          color:#fff;
          border:none;
          width:32px;height:32px;
          border-radius:50%;
          cursor:pointer;
          font-size:1.2rem;
          line-height:1;
        ">✕</button>
      </div>

      <!-- Вкладки чата -->
      <div style="display:flex;background:#f3f4f6;border-bottom:2px solid #e5e7eb;">
        <button id="chat-tab-group" class="chat-tab active" style="
          flex:1;
          padding:12px;
          border:none;
          background:transparent;
          cursor:pointer;
          font-size:0.95rem;
          font-weight:bold;
          color:#4f46e5;
          border-bottom:3px solid #4f46e5;
        ">🏫 Моя группа</button>
        <button id="chat-tab-global" class="chat-tab" style="
          flex:1;
          padding:12px;
          border:none;
          background:transparent;
          cursor:pointer;
          font-size:0.95rem;
          color:#6b7280;
          border-bottom:3px solid transparent;
        ">🌍 Общий</button>
      </div>

      <!-- Список сообщений -->
      <div id="chat-messages" style="
        flex:1;
        overflow-y:auto;
        padding:16px;
        background:#f9fafb;
        display:flex;
        flex-direction:column;
        gap:10px;
      "></div>

      <!-- Форма отправки -->
      <div style="
        padding:12px;
        background:#fff;
        border-top:2px solid #e5e7eb;
        display:flex;
        gap:8px;
        align-items:flex-end;
      ">
        <textarea id="chat-input" placeholder="Написать сообщение..." rows="1" style="
          flex:1;
          padding:10px 14px;
          border:2px solid #e5e7eb;
          border-radius:14px;
          resize:none;
          font-family:inherit;
          font-size:0.95rem;
          max-height:120px;
          outline:none;
        "></textarea>
        <button id="chat-send" style="
          background:#4f46e5;
          color:#fff;
          border:none;
          width:44px;height:44px;
          border-radius:50%;
          cursor:pointer;
          font-size:1.2rem;
          flex-shrink:0;
        ">📤</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
