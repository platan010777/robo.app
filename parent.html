<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ec4899" />
  <title>📖 Родительский доступ — КЛАСС РОБОТОТЕХНИКИ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' width='100' height='100'%3E%3Cg%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%232d3748' stroke-width='4'/%3E%3Cpath d='M 50 5 A 45 45 0 0 1 89 72.5' fill='none' stroke='%2322c55e' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M 89 72.5 A 45 45 0 0 1 11 72.5' fill='none' stroke='%233b82f6' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M 11 72.5 A 45 45 0 0 1 50 5' fill='none' stroke='%23ef4444' stroke-width='10' stroke-linecap='round'/%3E%3Crect x='25' y='35' width='50' height='25' rx='8' fill='%232d3748'/%3E%3Ccircle cx='38' cy='47' r='5' fill='%23ffffff'/%3E%3Ccircle cx='62' cy='47' r='5' fill='%23ffffff'/%3E%3Cpath d='M 38 67 Q 50 77 62 67' stroke='%232d3748' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
      background: #fdf2f8;
      color: #1f2937;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(90deg, #ec4899, #be185d);
      color: #fff;
      padding: 16px 20px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .topbar h1 {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .loading, .error-state {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.1rem;
    }

    .loading { color: #ec4899; }
    .error-state { color: #ef4444; }

    .robot-emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .child-name {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899, #be185d);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #fce7f3;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #be185d;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .lesson-card {
      background: #fafafa;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      border-left: 4px solid #ec4899;
    }

    .hw-card {
      background: #fce7f3;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      border-left: 4px solid #ec4899;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 style="display:flex;align-items:center;gap:8px;">
    <div class="header-logo-container">
    <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <g>
        <circle cx="50" cy="50" r="40" fill="#ffffff"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#2d3748" stroke-width="4"/>
        <path d="M 50 10 A 40 40 0 0 1 84.6 70" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
        <path d="M 84.6 70 A 40 40 0 0 1 15.4 70" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
        <path d="M 15.4 70 A 40 40 0 0 1 50 10" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
        <rect x="28" y="36" width="44" height="20" rx="8" fill="#2d3748"/>
        <circle cx="40" cy="46" r="5" fill="#ffffff"/>
        <circle cx="60" cy="46" r="5" fill="#ffffff"/>
        <path d="M 38 66 Q 50 76 62 66" stroke="#2d3748" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  РОДИТЕЛЬСКИЙ ДОСТУП
</h1>
  </header>

  <main>
    <div id="content">
      <div class="loading">
        <span class="robot-emoji">🤖</span>
        Загружаю...
      </div>
    </div>
  </main>

  <div class="footer">
    Сделано с ❤️ для юных робототехников
  </div>

  <script type="module" src="js/parent.js"></script>
</body>
</html>
