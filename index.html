<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>🤖 КЛАСС РОБОТОТЕХНИКИ: журнал посещаемости</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <header class="topbar">
    <h1>🤖 КЛАСС РОБОТОТЕХНИКИ: журнал</h1>
    <div id="user-info"></div>
  </header>

   <nav class="tabs">
    <button data-tab="journal" class="active">📋 Журнал</button>
    <button data-tab="requests">📨 Заявки</button>
    <button data-tab="students">👥 Ученики</button>
    <button data-tab="lessons">📅 Занятия</button>
    <button data-tab="reports">📊 Отчёты</button>
    <button data-tab="qrcodes">📱 QR групп</button>
    <button data-tab="passes">🎫 Пропуска</button>
    <button data-tab="settings">⚙️ Настройки</button>
  </nav>

     <main id="app">
    <section id="tab-journal" class="tab active">
      <h2>📋 Журнал посещаемости</h2>
    </section>
    <section id="tab-requests" class="tab">
      <h2>📨 Заявки от учеников</h2>
    </section>
    <section id="tab-students" class="tab">
      <h2>👥 Ученики</h2>
    </section>
    <section id="tab-lessons" class="tab">
      <h2>📅 Занятия</h2>
    </section>
    <section id="tab-reports" class="tab">
      <h2>📊 Отчёты</h2>
    </section>
    <section id="tab-settings" class="tab">
      <h2>⚙️ Настройки</h2>
    </section>
    <section id="tab-qrcodes" class="tab">
      <h2>📱 QR-коды групп</h2>
    </section>
    <section id="tab-passes" class="tab">
      <h2>🎫 Пропуска</h2>
    </section>
  </main>

  <div id="auth-screen" class="modal">
    <div class="modal-box">
      <h2>🔐 Вход</h2>
      <input id="auth-email" type="email" placeholder="Email" />
      <input id="auth-password" type="password" placeholder="Пароль" />
      <button id="auth-login">Войти</button>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
