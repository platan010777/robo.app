<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Проверка ключа</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #fef9c3; }
    h1 { color: #4f46e5; }
    .box { background: #fff; padding: 20px; border-radius: 12px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .ok { color: #16a34a; font-weight: bold; font-size: 1.2rem; }
    .bad { color: #dc2626; font-weight: bold; font-size: 1.2rem; }
    .val { background: #f3f4f6; padding: 10px; border-radius: 6px; word-break: break-all; font-family: monospace; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🔍 Проверка настроек Supabase</h1>
  <div id="result">Проверяю...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // 👇 ВСТАВЬ СВОИ ЗНАЧЕНИЯ СЮДА
    const SUPABASE_URL = 'https://wyldhqsbgyhqcdmsjeud.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5bGRocXNiZ3locWNkbXNqZXVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTA4ODcsImV4cCI6MjEwNTA2Njg4N30.haCb0Ihyfq3UxJ02cP-iOQ-kF35Gbd5D6hzZwMt5hSw';

    const result = document.getElementById('result');
    let html = '';

    // --- Проверка 1: URL ---
    html += '<div class="box"><b>1. URL проекта</b>';
    html += `<div class="val">${SUPABASE_URL}</div>`;
    const urlLen = SUPABASE_URL.length;
    html += `<div>Длина: <b>${urlLen}</b> символов</div>`;

    if (/[а-яА-ЯёЁ]/.test(SUPABASE_URL)) {
      html += '<div class="bad">❌ Есть русские буквы в URL!</div>';
    } else if (SUPABASE_URL !== SUPABASE_URL.trim()) {
      html += '<div class="bad">❌ Есть пробелы в начале или конце URL!</div>';
    } else if (SUPABASE_URL.includes('/rest/v1')) {
      html += '<div class="bad">❌ Убери /rest/v1/ из URL! Нужен только https://xxx.supabase.co</div>';
    } else if (!SUPABASE_URL.startsWith('https://') || !SUPABASE_URL.includes('.supabase.co')) {
      html += '<div class="bad">❌ URL выглядит неправильно. Должен быть вида https://xxx.supabase.co</div>';
    } else {
      html += '<div class="ok">✅ URL выглядит корректно</div>';
    }
    html += '</div>';

    // --- Проверка 2: Ключ ---
    html += '<div class="box"><b>2. Anon-ключ</b>';
    html += `<div class="val">${SUPABASE_ANON_KEY.slice(0, 40)}...${SUPABASE_ANON_KEY.slice(-20)}</div>`;
    const keyLen = SUPABASE_ANON_KEY.length;
    html += `<div>Длина: <b>${keyLen}</b> символов</div>`;

    if (/[а-яА-ЯёЁ]/.test(SUPABASE_ANON_KEY)) {
      html += '<div class="bad">❌ Есть русские буквы в ключе!</div>';
    } else if (SUPABASE_ANON_KEY !== SUPABASE_ANON_KEY.trim()) {
      html += '<div class="bad">❌ Есть пробелы в начале или конце ключа!</div>';
    } else if (/\s/.test(SUPABASE_ANON_KEY)) {
      html += '<div class="bad">❌ Внутри ключа есть пробел или перенос строки!</div>';
    } else if (keyLen < 200) {
      html += '<div class="bad">❌ Ключ слишком короткий (обычно ~220+ символов). Скопируй заново!</div>';
    } else if (!SUPABASE_ANON_KEY.startsWith('eyJ')) {
      html += '<div class="bad">❌ Ключ должен начинаться с "eyJ"</div>';
    } else {
      html += '<div class="ok">✅ Ключ выглядит корректно</div>';
    }
    html += '</div>';

    // --- Проверка 3: Попытка подключения ---
    html += '<div class="box" id="conn-test"><b>3. Проверка связи с Supabase</b><div>Отправляю тестовый запрос...</div></div>';
    result.innerHTML = html;

    try {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await supabase.auth.getSession();

      const connBox = document.getElementById('conn-test');

      if (error) {
        connBox.innerHTML = `<b>3. Проверка связи с Supabase</b>
          <div class="bad">❌ Ошибка: ${error.message}</div>
          <div style="margin-top:8px;font-size:0.9rem;color:#666">
            Если ошибка про ISO-8859-1 — значит в URL или ключе есть невидимый символ.<br>
            Если про "Invalid API key" — ключ неправильный.<br>
            Если про "relation does not exist" — это нормально, значит связь работает! 🎉
          </div>`;
      } else {
        connBox.innerHTML = `<b>3. Проверка связи с Supabase</b>
          <div class="ok">✅ Связь работает! Ошибок нет.</div>
          <div style="margin-top:8px;font-size:0.9rem;color:#666">
            Значит проблема была в другом месте — например, в старом кэше браузера.
            Обнови главную страницу с Ctrl+Shift+R.
          </div>`;
      }
    } catch (e) {
      const connBox = document.getElementById('conn-test');
      connBox.innerHTML = `<b>3. Проверка связи с Supabase</b>
        <div class="bad">❌ Критическая ошибка: ${e.message}</div>
        <div style="margin-top:8px;font-size:0.9rem;color:#666">
          Эта ошибка указывает на проблему с самими значениями URL или ключа.
          Скорее всего, есть невидимый символ. Скопируй их заново из Supabase.
        </div>`;
    }
  </script>
</body>
</html>
